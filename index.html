<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="imageSideLogo">
            <div class="logoAndNameCon">
                <img src="images/odin-lined.png" alt="Logo of The Odin Project" class="logo">
                <h1 class="logoName">ODIN</h1>
            </div>
            <p class="credits">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">unsplash.com</a></p>
        </div>
        <div class="textSideForms">
            <form action="#" method="get">
                <div class="quoteCon">
                    <h4>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</h4>
                    <h4>You <em>know</em> you want to.</h4>
                </div>
                <div class="formInfo">
                    <h5>Let's do this!</h5>
                    <div class="labelInputCon">
                        <div class="con">
                            <label for="firstName">FIRST NAME</label>
                            <input type="text" id="firstName" name="firstName" placeholder="e.g. Tom" required>
                        </div>
                        <div class="con">
                            <label for="lastName">LAST NAME</label>
                            <input type="text" id="lastName" name="lastName" placeholder="e.g. Cruz" required>
                        </div>
                    </div>
                    <div class="labelInputCon">
                        <div class="con">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" placeholder="e.g. tomcruz@topgun.com" required>
                        </div>
                        <div class="con">
                            <label for="phoneNum">PHONE NUMBER</label>
                            <input type="number" id="phoneNum" name="phoneNum" placeholder="e.g. 09876543210" required>
                        </div>
                    </div>
                    <div class="labelInputCon">
                        <div class="con">
                            <label for="password">PASSWORD</label>
                            <input type="password" class="pass" id="password" name="password" placeholder="e.g. imissgoose" required>
                        </div>
                        <div class="con">
                            <label for="conPass">CONFIRM PASSWORD</label>
                            <input type="password" class="pass" id="conPass" name="conPass" placeholder="e.g. imissgoose" required>
                        </div>
                    </div>
                </div>
                <div class="aditional">
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="#">Log in</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
